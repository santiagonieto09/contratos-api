services:
  - type: web
    name: contratos-api
    runtime: php
    region: ohio
    plan: free
    buildCommand: bash bin/render-build.sh
    startCommand: php -d variables_order=EGPCS -S 0.0.0.0:${PORT:-8080} public/index.php
    healthCheckPath: /api/contratos/metodos-pago
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: APP_SECRET
        generateValue: true
      - key: JWT_PASSPHRASE
        value: ""
      - key: CORS_ALLOW_ORIGIN
        value: '^https?://.*$'
      - key: DEFAULT_URI
        value: https://contratos-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: contratos-db
          property: connectionString

databases:
  - name: contratos-db
    plan: free
    region: ohio
    postgresMajorVersion: 16
    ipAllowList: []
